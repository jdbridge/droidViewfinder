name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security problems here; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version or commit
      placeholder: 0.1.0, or a commit SHA
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: e.g. Pixel 9, Android 16
    validations:
      required: true
  - type: input
    id: usb-device
    attributes:
      label: Video device
      description: Name and USB vendor:product ID (shown in the source list).
      placeholder: e.g. "USB3.0 Video" 345f:2130
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Output of `adb logcat -s droidViewfinder`, and any crash stack trace. Remove anything you do not want to share."
      render: text
