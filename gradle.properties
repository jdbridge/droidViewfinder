android.useAndroidX=true
kotlin.code.style=official
# Gradle's default 512 MB heap is too small for this build. The build container overrides this with
# its own ~/.gradle/gradle.properties (see build-container/container-init.sh).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
